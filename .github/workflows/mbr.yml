name: Build MEMX ASM

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install NASM
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm

      - name: Verify source files
        run: |
          ls -la
          test -f mbr.asm     || (echo "mbr.asm missing" && exit 1)
          test -f image.raw   || (echo "image.raw missing" && exit 1)
          test -f palette.raw || (echo "palette.raw missing" && exit 1)
          echo "image.raw size:   $(stat -c%s image.raw)   bytes"
          echo "palette.raw size: $(stat -c%s palette.raw) bytes"

      - name: Build MBR
        run: |
          nasm -f bin mbr.asm -o mbr.bin
          SIZE=$(stat -c%s mbr.bin)
          echo "mbr.bin size: $SIZE"
          if [ "$SIZE" -ne 512 ]; then
            echo "ERROR: mbr.bin must be exactly 512 bytes, got $SIZE"
            exit 1
          fi

      - name: Build disk image
        run: |
          cat mbr.bin image.raw palette.raw > mbr_disk.bin
          TOTAL=$(stat -c%s mbr_disk.bin)
          echo "mbr_disk.bin size: $TOTAL"
          if [ "$TOTAL" -lt 65280 ]; then
            echo "ERROR: mbr_disk.bin too small, expected >= 65280 bytes"
            exit 1
          fi

      - name: Build UEFI (optional)
        if: ${{ hashFiles('uefi.asm') != '' }}
        run: |
          nasm -f win64 uefi.asm -o uefi.obj
          # Если есть линкер — раскомментируй
          # x86_64-w64-mingw32-ld -o uefi.dll -e efi_main --subsystem 10 uefi.obj
          # objcopy -O binary uefi.dll uefi.bin
          echo "uefi.asm found and compiled to uefi.obj (linking skipped)"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: memx-asm-build
          path: |
            mbr.bin
            mbr_disk.bin
            uefi.bin
            uefi.obj

      - name: Commit built binaries (optional)
        if: github.event_name == 'push'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mbr.bin mbr_disk.bin 2>/dev/null || true
          git diff --staged --quiet || git commit -m "build: update ASM binaries [skip ci]"
          git push || echo "Nothing to push"